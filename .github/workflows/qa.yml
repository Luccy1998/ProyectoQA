name: QA Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:

  # =====================================================
  # 1. CALIDAD DEL CÓDIGO
  # =====================================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript
        run: npm run test:typecheck

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high


  # =====================================================
  # 2. PRUEBAS API
  # =====================================================
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas API
        run: npm run test:api

      - name: Guardar reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report/
          if-no-files-found: ignore


  # =====================================================
  # 3. PRUEBAS TRANSACCIONALES Y ASÍNCRONAS
  # =====================================================
  integration-tests:
    name: Transaction and Async Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas transaccionales
        run: npm run test:transaction

      - name: Ejecutar pruebas asíncronas
        run: npm run test:async

      - name: Guardar reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integration
          path: playwright-report/
          if-no-files-found: ignore


  # =====================================================
  # 4. PRUEBAS E2E
  # =====================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e

      - name: Guardar reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: playwright-report/
          if-no-files-found: ignore


  # =====================================================
  # 5. PRUEBA DE PERFORMANCE
  # =====================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Iniciar servidor mock
        run: |
          node mocks/performance-server.js > performance-server.log 2>&1 &

      - name: Esperar disponibilidad del servidor
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:3001/health; then
              echo "Servidor mock disponible"
              exit 0
            fi

            echo "Esperando servidor..."
            sleep 1
          done

          echo "El servidor mock no estuvo disponible"
          exit 1

      - name: Ejecutar prueba de performance
        run: npm run test:performance

      - name: Guardar logs del servidor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-server-log
          path: performance-server.log
          if-no-files-found: ignore